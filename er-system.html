<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>急診系統 模擬範本</title>
<style>
:root{
  --bg:#f3f5f1; --panel:#fff; --ink:#1d2a1f; --muted:#6b7a6d; --line:#dde3da;
  --top:#f6d835; --top-ink:#3b3300; --accent:#2f7d4f; --accent-soft:#e3f2e8;
  --sel:#fff7c2; --danger:#c0392b;
  --t1:#d32f2f; --t2:#f57c00; --t3:#f9c80e; --t4:#43a047; --t5:#90a4ae;
  --y:#8fe3ef; --n:#fff04d; --p:#8bd55a; --o:#ff9d8a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161b17; --panel:#202721; --ink:#e7eee8; --muted:#93a396; --line:#324035; --accent-soft:#233a2b; --sel:#4a4420;--top-ink:#2a2400}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Microsoft JhengHei","PingFang TC",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* 頂部選單 */
.menubar{background:var(--top);color:var(--top-ink);display:flex;align-items:center;gap:2px;padding:0 8px;flex-wrap:wrap;min-height:36px}
.menubar .m{padding:7px 10px;border-radius:4px;cursor:pointer;font-weight:500;white-space:nowrap}
.menubar .m:hover{background:rgba(0,0,0,.1)}
.menubar .sp{flex:1}
.menubar .info{font-size:12px;padding:0 8px}

/* 工具列 */
.toolbar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.7;margin-left:4px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 12px}
.seg button.on{background:var(--accent);color:#fff}
.search{border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--panel);width:170px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warn.on{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sp{flex:1}
.lbl{font-size:12px;color:var(--muted)}

/* 交班列 */
.handover{display:none;background:var(--accent-soft);border-bottom:1px solid var(--accent);padding:8px 12px;gap:10px;align-items:center;flex-wrap:wrap}
.handover.show{display:flex}
.handover select{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--panel)}

/* 主體 */
.main{flex:1;display:flex;min-height:0}
.listwrap{flex:1;overflow:auto;padding:12px;min-width:0}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.tri{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:#fff;font-weight:700;font-size:13px}
.tri.l1{background:var(--t1)}.tri.l2{background:var(--t2)}.tri.l3{background:var(--t3);color:#3b3300}.tri.l4{background:var(--t4)}.tri.l5{background:var(--t5)}

/* 卡片檢視 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--t5);border-radius:8px;padding:8px 10px;cursor:pointer;position:relative}
.card.l1{border-left-color:var(--t1)}.card.l2{border-left-color:var(--t2)}.card.l3{border-left-color:var(--t3)}.card.l4{border-left-color:var(--t4)}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.card.sel{background:var(--sel);outline:2px solid var(--accent)}
.card .r1{display:flex;align-items:center;gap:6px}
.card .bed{font-weight:700;font-size:15px;min-width:34px}
.card .nm{font-weight:600;font-size:15px}
.card .as{color:var(--muted);font-size:12px;margin-left:auto}
.card .cc{margin:4px 0 6px;font-size:14px;min-height:20px}
.card .staff{display:flex;gap:10px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px}
.card .staff b{color:var(--ink);font-weight:600}
.card .ck{position:absolute;right:8px;top:8px;width:18px;height:18px}

.zone{margin-bottom:14px}
.zh{display:flex;gap:12px;align-items:center;margin:0 0 6px;padding:4px 8px;background:var(--accent-soft);border-radius:6px;flex-wrap:wrap}
.occ{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 8px;background:var(--panel)}
.occ.warn{background:#fff3cd;color:#7a5a00;border-color:#e6c453}.occ.full{background:var(--danger);color:#fff;border-color:var(--danger)}
.pbar select{border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--panel)}
/* 列表檢視 */
table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{background:#dcebd5;color:#2b4a33;text-align:left;font-weight:600;padding:6px 8px;font-size:13px;position:sticky;top:0;white-space:nowrap}
@media (prefers-color-scheme:dark){th{background:#2b3d30;color:#cfe3d4}}
td{padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
tbody tr.sel{background:var(--sel)}
td.cc{white-space:normal;min-width:180px}
.st{display:inline-block;min-width:24px;text-align:center;border-radius:4px;font-weight:600;font-size:12px;padding:1px 4px}
.st.Y{background:var(--y);color:#063}.st.N{background:var(--n);color:#440}.st.P{background:var(--p);color:#143}.st.O{background:var(--o);color:#600}

/* 病人詳細 */
.detail{border-top:2px solid var(--accent);background:var(--panel);height:46%;min-height:220px;max-height:60vh;display:flex;flex-direction:column}
.detail.none{height:auto;min-height:0}
.pbar{display:flex;gap:14px;align-items:center;padding:6px 12px;background:var(--accent-soft);flex-wrap:wrap}
.pbar .nm{font-weight:700;font-size:16px}
.pbar span.k{color:var(--muted);font-size:12px;margin-right:3px}
.tabs{display:flex;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:1px solid var(--line);border-bottom:0;background:var(--bg);padding:5px 14px;border-radius:6px 6px 0 0}
.tabs button.on{background:var(--panel);font-weight:600;color:var(--accent);position:relative;top:1px}
.tabbody{flex:1;overflow:auto;padding:12px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);resize:vertical}
.dx-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.dx{display:grid;grid-template-columns:24px 62px 110px 1fr 70px 28px;gap:8px;align-items:center;padding:5px 8px;border:1px solid var(--line);border-radius:8px}
.dx .code{font-weight:700;color:var(--accent);font-family:Consolas,monospace}
.dx .en{color:var(--muted);font-size:12px}
.x{border:0;background:none;color:var(--danger);font-size:18px;line-height:1}
.sugwrap{position:relative;max-width:560px}
.sug{position:absolute;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--accent);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-height:260px;overflow:auto;z-index:20;display:none}
.sug div{padding:6px 10px;cursor:pointer;display:flex;gap:10px}
.sug div:hover,.sug div.hl{background:var(--accent-soft)}
.sug .c{font-weight:700;min-width:70px;color:var(--accent);font-family:Consolas,monospace}
.sug .e{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.log{font-size:12px;color:var(--muted);margin-top:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.note{border-left:3px solid var(--accent);padding:4px 10px;margin:6px 0;background:var(--bg);border-radius:0 6px 6px 0}
.note small{color:var(--muted)}
@media (max-width:700px){.dx{grid-template-columns:24px 60px 1fr 28px}.dx .en,.dx .pri{display:none}.detail{height:55%}}

/* ===== 仿現行急診系統版面 ===== */
.menubar{background:#f7e83a;font-size:13px}
.menubar .m{padding:5px 8px;font-weight:400}
.filterbar{background:#f7e83a;border-top:1px solid #c9bb1c;padding:4px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#3b3300}
.rg{display:flex;gap:2px;align-items:center;flex-wrap:wrap;border:1px solid #c9bb1c;background:#fbf29a;padding:2px 8px;border-radius:2px}
.rg label{display:inline-flex;align-items:center;gap:2px;padding:1px 5px;cursor:pointer;font-weight:600}
.rg input{margin:0}
.rg .n{font-size:10px;opacity:.65}
.filterbar .search{width:150px;padding:2px 8px;border-radius:2px}
.filterbar .btn{padding:2px 12px;border-radius:2px;background:#fffbd0;border-color:#c9bb1c;color:#3b3300}
.filterbar .btn.warn.on{background:var(--danger);color:#fff}
.top{flex:1;display:flex;min-height:0}
.side{width:196px;flex-shrink:0;background:#e9efe5;border-left:1px solid var(--line);padding:8px;overflow:auto;font-size:12px;color:#102010}
.side .f{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.side .f span{min-width:44px;color:#2b4a33}.side .f input{flex:1;min-width:0;border:1px solid #9bb09b;background:#fff;padding:1px 4px;border-radius:0;color:#111}
.side .lg{margin-top:8px;border:1px solid #c9bb1c;background:#fbf29a;padding:6px 8px;color:#3b3300;line-height:1.9}
.side .lg b{display:block;text-align:center}
.side .lg i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.3)}
.listwrap{padding:0}
.legend{padding:4px 8px;margin:0;background:var(--panel);border-bottom:1px solid var(--line)}
#view{padding:0}
#view .cards,#view .zone{padding:0 8px}
table.emr{border:0;border-radius:0;background:#9ccf9c;color:#102010;font-size:13px}
table.emr th{background:#cfe0c4;color:#1d3b22;border:1px solid #7fae7f;padding:3px 6px;font-weight:600;text-align:center}
table.emr td{padding:2px 6px;border:1px solid #84b484;text-align:center}
table.emr td.l{text-align:left}
table.emr tbody tr:hover{background:#b6e0b6}
table.emr tbody tr.sel{background:#fff7a8}
table.emr .nm{font-weight:700}
table.emr .arr{color:#5b6b5e;font-size:11px;margin-left:2px}
table.emr .stay{font-variant-numeric:tabular-nums}
table.emr .stay.long{color:#b00020;font-weight:700}
table.emr td.stc{padding:1px 2px}
table.emr .st{display:block;min-width:0;border-radius:0;padding:2px 0;font-size:13px;width:100%}
table.emr .st.Y{background:#7fe3f0;color:#033}table.emr .st.N{background:#fff04d;color:#440}table.emr .st.P{background:#74d24a;color:#143}table.emr .st.O{background:#ff9d8a;color:#600}
.fkeys{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;padding:5px 6px;background:#c9dcc0;border-top:1px solid #7fae7f}
.fk{border:1px solid #fff;border-right-color:#6b6b6b;border-bottom-color:#6b6b6b;background:#e6e6e6;color:#111;padding:3px 2px;font-size:13px;border-radius:0;white-space:nowrap;overflow:hidden}
.fk:hover{background:#f4f4f4}
.fk.on{background:#0a64c8;color:#fff;border-color:#0a64c8}
.detail{background:#c9dcc0;border-top:2px solid #6b8f6b}
.detail .pbar{background:#d8e8d0;color:#102010}
.detail .tabbody{background:#c9dcc0;padding:6px;color:#102010}
fieldset.fs{border:1px solid #7fae7f;margin:0 0 6px;padding:2px 6px 6px;background:#c9dcc0}
fieldset.fs legend{font-family:Consolas,monospace;font-size:12px;color:#335;padding:0 3px}
.dxwrap{display:flex;gap:8px}
.dxl{width:92px;flex-shrink:0;font-family:Consolas,monospace;font-size:12px}
.dxl div{display:flex;align-items:center;gap:4px;margin-bottom:4px}.dxl input{width:60px;border:1px solid #9bb09b;background:#fff;height:20px}
.dxrows{flex:1;min-width:0}
.dxr{display:grid;grid-template-columns:20px 62px 112px 46px 1fr 54px 22px;gap:6px;align-items:center;height:26px}
.dxr .n{text-align:right;font-family:Consolas,monospace}
.dxr .ro{font-weight:700;color:#1a2fb0;font-family:Consolas,monospace}
.dxr .code{background:#fff;border:1px solid #9bb09b;height:22px;line-height:20px;padding:0 4px;font-family:Consolas,monospace;font-weight:700;color:#111}
.dxr .desc{background:#fff;border:1px solid #9bb09b;height:22px;line-height:20px;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#111}
.dxr .desc .en{color:#666;font-size:12px}
.dxr.empty2 .ro,.dxr.empty2 .n{opacity:.55}
.dxr label{display:flex;align-items:center;gap:2px;font-size:12px}
.shortbar{display:flex;gap:4px;padding:4px 6px;background:#b9d0f0;border-top:1px solid #7f9fcf}
.shortbar button{border:1px solid #fff;border-right-color:#555;border-bottom-color:#555;background:#e6eefc;color:#0a2a9a;font-weight:700;padding:2px 22px;border-radius:0}
@media (max-width:900px){.side{display:none}.fkeys{grid-template-columns:repeat(8,1fr)}.dxr{grid-template-columns:20px 56px 96px 40px 1fr 22px}.dxr .pri{display:none}}

/* ===== 柔化配色與留白 ===== */
:root{--bg:#f5f7f4}
.menubar,.filterbar{background:#fbf3c9;color:#4a4220}
.filterbar{border-top:1px solid #efe3a0;padding:7px 12px;gap:12px}
.menubar{padding:2px 10px}.menubar .m{padding:6px 10px}
.rg{background:#fffbe8;border-color:#eadf9c;border-radius:6px;padding:3px 8px}
.rg label{padding:2px 6px;font-weight:500}
.filterbar .search{border-radius:6px;border:1px solid #eadf9c;background:#fffef6;padding:4px 10px}
.filterbar .btn{background:#fffbe8;border-color:#eadf9c;border-radius:6px;padding:4px 14px}
.legend{padding:6px 12px;font-size:12px}
table.emr{background:#fff;color:#243326;font-size:14px}
table.emr th{background:#eaf1e6;color:#3a5340;border:0;border-bottom:1px solid #d5e0d0;padding:8px 8px;font-weight:600}
table.emr td{padding:7px 8px;border:0;border-bottom:1px solid #edf1ea}
table.emr tbody tr:nth-child(even){background:#f8faf6}
table.emr tbody tr:hover{background:#eef6ea}
table.emr tbody tr.sel{background:#fff6cf}
table.emr td.stc{padding:4px 6px}
table.emr .st{border-radius:4px;padding:3px 0;font-weight:600}
table.emr .st.Y{background:#c4ebf1;color:#1d5560}table.emr .st.N{background:#fff2a8;color:#6b5a00}
table.emr .st.P{background:#c6e8b0;color:#2f5a1e}table.emr .st.O{background:#ffc9bc;color:#8a2f1c}
table.emr .stay{font-weight:700}
table.emr .stay.s1{color:#d32f2f}table.emr .stay.s2{color:#e67e00}table.emr .stay.s3{color:#1f6fb5}table.emr .stay.s4{color:#111}
.side{background:#f4f7f2;padding:12px}
.side .f{margin-bottom:8px}
.side .f input{border:1px solid #d3ddd0;border-radius:6px;padding:4px 6px}
.side .lg{background:#fffbe8;border:1px solid #eadf9c;border-radius:8px;padding:10px 12px;line-height:2}
.detail{background:#f4f7f2;border-top:1px solid #d3ddd0}
.detail .pbar{background:#eaf1e6;padding:8px 14px;gap:16px}
.fkeys{background:#f4f7f2;border-top:0;gap:6px;padding:8px 10px}
.fk{background:#fff;border:1px solid #d3ddd0;border-radius:6px;padding:6px 2px;color:#2c3a2e}
.fk:hover{background:#f0f6ed;border-color:#b8c9b3}
.fk.on{background:#4a86c5;border-color:#4a86c5;color:#fff}
.detail .tabbody{background:#f4f7f2;padding:8px 12px}
fieldset.fs{border:1px solid #d3ddd0;border-radius:8px;background:#fff;padding:6px 12px 12px;margin-bottom:10px}
fieldset.fs legend{color:#6b7a6d}
.dxr{height:32px;gap:8px}
.dxr .code,.dxr .desc,.dxl input{border:1px solid #d3ddd0;border-radius:5px;background:#fafcf9;height:26px;line-height:24px}
.shortbar{background:#e7eefa;border-top:1px solid #d2deef;padding:8px 10px;gap:8px}
.shortbar button{background:#fff;border:1px solid #c3d2ea;border-radius:6px;color:#2a4a8a;font-weight:600;padding:4px 22px}
.detail .pbar select,.detail .pbar input{border-radius:6px}

/* ===== 緊湊卡片 + 可收合下半部 ===== */
.cards{grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:6px}
.card{padding:4px 8px 5px;border-radius:6px}
.card .r1{gap:5px}
.card .bed{font-size:13px;min-width:30px}
.card .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .as{font-size:11px}
.card .tri{width:18px;height:18px;font-size:11px;border-radius:5px}
.card .cc{margin:1px 0 2px;font-size:12.5px;min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4a5a4c}
.card .staff{border-top:0;padding-top:0;gap:8px;font-size:11px}
.zone{margin-bottom:8px}
.zh{margin:0 0 4px;padding:3px 8px;gap:8px;font-size:13px}
#view .cards,#view .zone{padding:0 8px}
.detail.min{height:auto;min-height:0}
.detail.min .fkeys,.detail.min .tabbody,.detail.min .shortbar{display:none}

/* ===== 配色：淺綠灰底，降低大面積白色 ===== */
:root{--bg:#d6e2d1;--panel:#eef4ea;--line:#b5c6af;--sel:#fff1b0;--accent-soft:#e1edda}
body{background:#d6e2d1}
.legend{background:#e4eddf;border-bottom:1px solid #b5c6af}
table.emr{background:#eef4ea;color:#1c2b1f}
table.emr th{background:#c3d6bd;color:#1f3a25;border-bottom:1px solid #a4bb9d}
table.emr td{border-bottom:1px solid #c9d8c3}
table.emr tbody tr:nth-child(even){background:#e3ede0}
table.emr tbody tr:hover{background:#d3e5cd}
table.emr tbody tr.sel{background:#ffef9e}
.side{background:#d0ddca;border-left:1px solid #b5c6af}
.side .f input{background:#fff;border-color:#a9bba3}
.side .lg{background:#f6efbf;border-color:#e2d58c}
.detail{background:#d0ddca;border-top:2px solid #a4bb9d}
.detail .pbar{background:#c3d6bd}
.fkeys,.detail .tabbody{background:#d0ddca}
.fk{background:#f1f6ee;border-color:#a9bba3}
.fk:hover{background:#fff;border-color:#8fa88a}
.fk.on{background:#3f7cbc;border-color:#3f7cbc}
fieldset.fs{background:#e4eddf;border-color:#a9bba3}
.dxr .code,.dxr .desc,.dxl input{background:#fff;border-color:#a9bba3}
.shortbar{background:#cbd9f0;border-top:1px solid #aebfdd}
.shortbar button{background:#f1f6ff;border-color:#a9bbdb}
.card{background:#f3f8f0;border-color:#b5c6af}
.card.sel{background:#fff1b0}
.zh{background:#c9dcc2}
.occ{background:#eef4ea}
.chip,.seg button{background:#eef4ea}

/* ===== 護眼配色（預設）：中低亮度灰綠，避免大面積白色 ===== */
:root{--bg:#b4c2b0;--panel:#c6d2c2;--ink:#17221a;--muted:#3f5044;--line:#93a690;--sel:#ebe0a0;--accent:#2f6b45;--accent-soft:#b2c4ad}
body{background:#b4c2b0;color:#17221a}
.menubar,.filterbar{background:#d8cf8e;color:#3b3500}
.filterbar{border-top:1px solid #bdb36d}

/* ===== 五級檢傷視窗 ===== */
.tm{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:center;justify-content:center}
.tm.show{display:flex}
.tmb{background:#e8efe2;border:2px solid #3b5a3a;border-radius:6px;width:min(980px,96vw);max-height:94vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.4);color:#12210f}
.tmb .tt{display:flex;align-items:center;gap:8px;background:#f4f7f0;padding:5px 10px;font-size:16px;border-bottom:1px solid #9bb391}
.tmb .tt .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:inherit}
.tmb .tt b.cross{color:#d22;font-size:20px}
.tri3{display:grid;grid-template-columns:150px 1.1fr 1.5fr;height:300px;border-bottom:1px solid #9bb391;background:#cfe0c6}
.tri3 .cl{overflow:auto;border-right:1px solid #9bb391}
.tri3 .cl:last-child{border-right:0}
.tri3 .h{position:sticky;top:0;background:#16168a;color:#fff;padding:2px 6px;font-size:14px;z-index:1}
.tri3 .it{padding:3px 6px;border-bottom:1px solid #b5c9ab;cursor:pointer;font-size:15px;line-height:1.35}
.tri3 .c1 .it{background:#cfd4cc}.tri3 .c2 .it{background:#efcfa6}
.tri3 .it:hover{filter:brightness(1.07)}
.tri3 .it.on{outline:2px solid #1b4fd6;outline-offset:-2px;font-weight:800}
.tri3 .it.red{color:#d11}
.tl1{background:#f78df0}.tl2{background:#ff8a2a}.tl3{background:#ffee44}.tl4{background:#86e870}.tl5{background:#84e8f2}
.tri3 .emp{padding:10px;opacity:.6;font-size:14px}
.tmf{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:8px 12px;align-items:start}
.tmf .lv{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px}
.tmf .bx{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;font-size:24px;font-weight:800;border-radius:4px;border:1px solid #6b8a62}
.tmf .pick{width:46px;height:46px;font-size:26px;font-weight:800;border:2px solid transparent;border-radius:4px;cursor:pointer;color:#222}
.tmf .pick.on{border-color:#123;box-shadow:0 0 0 2px #fff inset}
.tmf select,.tmf textarea{border:1px solid #6b8a62;border-radius:4px;background:#fffbe0;font:inherit;padding:3px 6px;color:#111}
.tmf textarea{width:100%;box-sizing:border-box;height:76px;resize:vertical}
.tmf .btns{display:flex;flex-direction:column;gap:8px}
.tmf .btns button{background:#0f8a82;color:#fff;border:0;border-radius:3px;font-size:18px;font-weight:800;padding:8px 22px;cursor:pointer}
.tmf .btns button.g{background:#8a8f88}
.tmf .btns button:hover{filter:brightness(1.1)}
.tmf .cur{display:flex;align-items:center;gap:8px}
body.dark .tmb{background:#26332b;color:#e6efe8;border-color:#6b8a62}
body.dark .tmb .tt{background:#2e3d33}

/* ===== 結構化病歷（急診結構化病歷，非外傷／外傷／小兒）===== */
.chart{--bg:#dfeed5;--panel:#eef6e8;--ink:#16261a;--mute:#4f6355;--line:#a7bf9a;--accent:#1f6f86;--accent-ink:#fff;--accent-soft:#d3e8e0;--ok:#1b7f4c;--warn:#a85f00;--crit:#c0282d;--crit-soft:#fbe0dd;--warn-soft:#fff0cf;--t1:#c0282d;--t2:#e0662a;--t3:#e3b02a;--t4:#2f8f5b;--t5:#4f7fb8;--trauma:#a8321f;--pedi:#5b4bb4;--sans:inherit;--mono:ui-monospace,Consolas,monospace;color:var(--ink);font-size:14.5px;line-height:1.5}
body.dark .chart{--bg:#1c2a22;--panel:#23332a;--ink:#e6efe8;--mute:#9fb3a5;--line:#3d5446;--accent:#4cc2d6;--accent-ink:#06222a;--accent-soft:#1d4048;--ok:#5fd093;--warn:#f0b04a;--crit:#ff7b7f;--crit-soft:#3a1d20;--warn-soft:#3a2d12;--trauma:#ff9a85;--pedi:#b7a8ff}
.chart [hidden]{display:none!important}
.chart button{font:inherit;color:inherit;cursor:pointer}
.chart input,.chart textarea,.chart select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.chart :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chart .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chart .tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px dashed var(--line);color:var(--mute)}
.chart .tri{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:3px 12px;border-radius:6px;color:#fff;background:var(--mute)}
.chart .tri[data-l="1"]{background:var(--t1)}
.chart .tri[data-l="2"]{background:var(--t2)}
.chart .tri[data-l="3"]{background:var(--t3);color:#2b2200}
.chart .tri[data-l="4"]{background:var(--t4)}
.chart .tri[data-l="5"]{background:var(--t5)}
.chart .modebar{display:flex;align-items:center;gap:8px}
.chart .modebar>span{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.chart .modebar .seg button{padding:7px 18px;font-weight:700}
.chart .modebar .seg button.on{background:var(--accent);color:var(--accent-ink)}

  let seed=20261030;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const pick=a=>a[Math.floor(rnd()*a.length)], ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const SUR=['陳','林','黃','張','李','王','吳','劉','蔡','楊','許','鄭','謝','郭','洪','曾','邱','廖','賴','徐','周','葉','蘇','莊','呂','江','何','蕭','羅','高'];
  const GM=['志明','俊宏','建國','家豪','冠宇','承恩','宗翰','柏毅','彥廷','信宏','文傑','仁豪','國華','榮輝','金龍','明德'];
  const GF=['淑芬','美玲','雅婷','怡君','佩珊','惠敏','靜宜','欣怡','秀英','麗華','詩涵','雨潔','心怡','玉蘭','淑惠','宛庭'];
  const CC={
   A:[['胸痛，冒冷汗','I21.9'],['意識改變','R40.20'],['呼吸困難','R06.02'],['突發口齒不清、肢體無力','I63.9'],['心悸、血壓低','I48.91'],['抽搐','R56.9'],['解黑便、頭暈','K92.2'],['嚴重過敏、喘','T78.2XXA'],['交通事故，多處外傷','T14.90XA'],['昏倒','R55']],
   B:[['胸悶','I20.0'],['發燒、意識混亂','A41.9'],['喘、無法平躺','I50.9'],['腹痛劇烈','R10.9'],['血糖過高','E11.65'],['嘔血','K92.2'],['肺炎疑似，喘','J18.9'],['低血糖昏迷','E16.2'],['頭暈、步態不穩','R42'],['COPD 惡化','J44.1']],
   C:[['腹瀉嘔吐','A09'],['上腹痛','K29.70'],['頭痛','R51.9'],['發燒咳嗽','R50.9'],['頭暈','R42'],['尿頻、排尿疼痛','N39.0'],['右下腹痛','K35.80'],['側腹絞痛','N23'],['下背痛','M54.5'],['全身無力','D64.9'],['咳嗽喉嚨痛','J06.9'],['血壓過高','I10']],
   D:[['頭部外傷','S06.0X0A'],['手部割傷','S61.411A'],['頭皮撕裂傷','S01.01XA'],['機車擦撞','V89.2XXA'],['跌倒，頭部撞傷','W19.XXXA'],['胸部撞傷','S22.39XA'],['腹部外傷','T14.90XA'],['被刀割傷','S61.411A']],
   E:[['跌倒，髖部疼痛','S72.001A'],['手腕疼痛腫脹','S52.501A'],['小腿受傷','S82.201A'],['腰部拉傷','S39.012A'],['下背痛','M54.5'],['肩膀疼痛','T14.90XA'],['腳踝扭傷','T14.90XA'],['運動傷害，膝蓋痛','T14.90XA'],['肋骨疼痛','S22.39XA']],
   F:[['發燒、喉嚨痛','J10.1'],['發燒咳嗽、疑似 COVID','U07.1'],['高燒、全身痠痛','J10.1'],['咳嗽、呼吸急促','J18.9'],['腹瀉、發燒','A09']],
   觀察:[['腹痛，待追蹤','R10.9'],['頭暈，待觀察','R42'],['胸痛，連續心肌酵素追蹤','R07.9'],['發燒，待培養結果','R50.9'],['脫水，輸液中','E86.0']],
   ICU待床:[['敗血症、低血壓','A41.9'],['呼吸衰竭，插管','J44.1'],['腦出血','I61.9'],['急性心肌梗塞','I21.9']]
  };
  const LV={A:[1,1,2,2,2,3],B:[2,2,2,3,3],C:[3,3,4,4,4,5],D:[3,3,4,4,5],E:[3,4,4,5],F:[3,4,4],觀察:[3,3,4],ICU待床:[1,1,2]};
  const DIR={A:['','','等檢查','等照會'],B:['','等住院','等照會','等ICU',''],C:['','','等住院',''],D:['','等縫合','','等住院'],E:['','等檢查','等住院',''],F:['','','觀察後續追蹤'],觀察:['等住院','等照會','觀察後續追蹤'],ICU待床:['等ICU']};
  const N={A:20,B:20,C:21,D:19,E:20,F:8,觀察:10,ICU待床:3};
  // 每區固定 2 位主責醫師、4 位護理師
  const ZD={A:[0,1],B:[2,3],C:[4,5],D:[6,7],E:[0,2],F:[1,3],觀察:[4,6],ICU待床:[0,2]};
  const ZN={A:[0,1,2,3],B:[4,5,6,7],C:[8,9,10,11],D:[12,13,14,15],E:[0,4,8,12],F:[1,5,9,13],觀察:[2,6,10,14],ICU待床:[3,7,11,15]};
  const out=[];let no=100;
  for(const z of Object.keys(N)){
    for(let i=1;i<=N[z];i++){
      const f=rnd()<.5, [cc,icd]=pick(CC[z]);
      const st={};
      if(rnd()<.85)st.med=pick('YYYNP');
      if(['A','B','D','E'].includes(z)&&rnd()<.5)st.proc=pick('YYNP');
      if(rnd()<.8)st.lab=pick('YYNPO');
      if(['A','B','D','E','F'].includes(z)&&rnd()<.6)st.xr=pick('YYNP');
      if(['A','B','D'].includes(z)&&rnd()<.4)st.ct=pick('YNO');
      if(['A','B','C','觀察'].includes(z)&&rnd()<.5)st.bio=pick('YP');
      if(['A','B'].includes(z)&&rnd()<.15)st.scope=pick('YN');
      if(['A','B','C','觀察'].includes(z)&&rnd()<.6)st.ekg=pick('YYNP');
      const bed=z==='觀察'?'觀'+String(i).padStart(2,'0'):z==='ICU待床'?'ICU'+i:z+String(i).padStart(2,'0');
      const hrs=z==='觀察'?rnd()*40+6:z==='ICU待床'?rnd()*20+3:Math.round(rnd()*rnd()*14*100)/100+.05;
      out.push((P(String(++no).padStart(4,'0'),bed,z,pick(LV[z]),pick(SUR)+(f?pick(GF):pick(GM)),f?'女':'男',ri(z==='F'?5:18,92),cc,
        DOCTORS[pick(ZD[z])],NURSES[pick(ZN[z])],hrs,pick(DIR[z]),st,rnd()<.3?[{code:icd,ro:rnd()<.3}]:[])));
    }
  }
  /* 流水號：依到院先後遞增（越晚到院號碼越大）；病歷號為另一組編號 */
  [...out].sort((a,b)=>a.arrive-b.arrive).forEach((q,i)=>{
    q.id=String(101+i).padStart(4,'0');
    q.mrn=String(10000000+(parseInt(q.id,10)*7919003)%89999999).padStart(8,'0');
  });
  /* 會診：有開立會診者，動向欄由系統自動顯示「會診某科」，不需手動選 */
  const CD={A:['心臟內科','神經內科'],B:['神經內科','胸腔內科','腸胃內科'],C:['腸胃內科','腎臟科'],D:['外科','神經外科'],E:['骨科'],F:['感染科'],觀察:['腸胃內科','心臟內科'],ICU待床:['神經內科']};
  for(const q of out){if(q.dir==='等照會'){const a=CD[q.zone]||['內科'];q.consults=[{dept:a[parseInt(q.id,10)%a.length],note:'',at:q.arrive+36e5,done:false}];q.dir=''}}
  /* 範例：模擬一起事故的大量傷患，分散在各區（旗標與區域無關） */
  let m=0;for(const q of out){if(m<8&&['A','B','D','E'].includes(q.zone)&&/機車|擦撞|外傷|撞傷|跌倒|傷|割/.test(q.cc)){q.mci=['重','中','輕','中','輕','重','輕','中'][m];m++}}
  return out;
})();

function filtered(){
  const q=S.q.trim().toLowerCase(),f=(v,k)=>!k||String(v).toLowerCase().includes(k.toLowerCase());
  const cmp={id:(a,b)=>b.id.localeCompare(a.id),lvl:(a,b)=>a.lvl-b.lvl||a.arrive-b.arrive,bed:(a,b)=>a.bed.localeCompare(b.bed,'zh',{numeric:true}),
    doc:(a,b)=>a.doc.localeCompare(b.doc,'zh')||a.lvl-b.lvl,stay:(a,b)=>a.arrive-b.arrive}[S.sort];
  return patients.filter(p=>(S.zone==='全部'||(S.zone==='大'?p.mci:p.zone===S.zone))&&(!q||(p.name+p.bed+p.cc+p.id+(p.mrn||'')).toLowerCase().includes(q))&&f(p.mrn||p.id,S.fId)&&f(p.id,S.fSeq)&&f(p.bed,S.fBed))
    .sort(S.zone==='大'?(a,b)=>MR[a.mci]-MR[b.mci]||(S.view==='card'?a.lvl-b.lvl||a.arrive-b.arrive:cmp(a,b)):S.view==='card'?(a,b)=>a.lvl-b.lvl||a.arrive-b.arrive:cmp);

function triClick(e){
  const t=e.target.closest('[data-tcat],[data-tcc],[data-tb],[data-tmod],[data-tx]');
  if(!t){if(e.target.id==='triModal')closeTri();return}
  const T=TT;
  if(t.dataset.tcat){T.cat=t.dataset.tcat;T.cc='';T.basis=''}
  else if(t.dataset.tcc){T.cc=t.dataset.tcc;T.basis=''}
  else if(t.dataset.tb){T.basis=t.dataset.tb;T.auto=+t.dataset.tl;T.mod=T.auto}
  else if(t.dataset.tmod)T.mod=+t.dataset.tmod;
  else if(t.dataset.tx==='cancel'){closeTri();return}
  else if(t.dataset.tx==='reset'){T.cat=triGuess(cur().cc);T.cc='';T.basis='';T.auto=T.iauto;T.mod=T.init;T.reason='';T.note=''}
  else if(t.dataset.tx==='save'){
    const p=cur();
    if(T.mod!==T.auto&&!T.reason){toast('修改分級需選擇「修改原因說明」');return}
    const old=p.lvl;p.lvl=T.mod;
    p.tri={cat:T.cat,cc:T.cc,basis:T.basis,auto:T.auto,mod:T.mod,reason:T.reason,note:T.note};
    p.notes.push({t:`檢傷：${T.cat}${T.cc?'／'+T.cc:''}${T.basis?'｜'+T.basis:''}；電腦分級 ${T.auto}、${old===T.mod?'維持':'修改為'} ${T.mod}${T.reason?'（'+T.reason+(T.note?'：'+T.note:'')+'）':''}`,at:new Date().toLocaleString('zh-TW',{hour12:false})});
    save();closeTri();renderList();renderDetail();toast(`檢傷已儲存：${T.mod} 級`);return}
  triRender();
}

function buildFinger(f, cp, side, ext){

  const d = f.base + (side==="L"?1:0);                       // 側別未指定時退回 9

  return {code:"S68.6"+cp+combo+ext, side:(side==="U"?"U":side)};
}
function buildToe(t, cp, side, ext){
  const lvl = t.great ? cp : String(+cp+2);                  // 拇趾 1/2、其他趾 3/4

}

function flatIndex(){

          const names = e.digits==="finger" ? FINGERS.map(f=>f.n) : TOES.map(t=>t.n+"截斷");
          rows.forEach((r,i)=> out.push({rk, region:reg.label, ck, cat:CAT_NAME[ck], name:names[i], side:"R", code:r.code, raw:true}));

const PEDS_RE=/小兒|嬰兒|幼兒|小孩|新生兒|寶寶|男童|女童|(\d+(?:\.\d+)?)\s*(?:個月|月大|週大|天大)|\b(?:pediatric|paediatric|infant|toddler|newborn|neonate|baby|\d+\s*(?:-|\s)?(?:month|mo|week|wk|day)s?[- ]old|\d+\s*(?:months?|mos)\b)/i;
const ageYears=t0=>{const t=t0.replace(/\b(?:in|within|for|over|past|last|recent)\s+(?:the\s+)?(?:recent\s+|past\s+|last\s+)?\d+\s*(?:years?|yrs?|months?|mos?|weeks?|wks?|days?)\b/gi,' ');const m=ABBR_Y.exec(t)?[0,ABBR_Y.exec(t)[1]]:t.match(/(\d+)\s*(?:歲|[- ]?years?[- ]?old|\s?y\/?o\b|\s?yrs?\b)/i)||t.match(/\b(\d{1,3})\s?(?:[MF](?!\s*height)\b|\/\s?[MFmf]\b)/);return m?+m[1]:null};
const PEDS_WEAK=/\bTOCC\b|\bactivity\b|\bappetite\b|\bNSD\b|\bBW\s*\d|\b(?:AGE|URI) S\/S\b|febrile convulsion|\bg6pd\w*|\bfx of (?:fever|URI)/i;
function detectMode(t0){const t=fixTypos(t0).replace(/\bu\/o\b/gi,'y/o');if(isTraumaText(t))return 'tr';const y=ageYears(t);if(PEDS_RE.test(t))return 'pd';if(y!=null)return y<18?'pd':'adult';if(PEDS_WEAK.test(t))return 'pd';return null}
/* 只在內容明顯屬於另一種病歷時才切換：外傷、小兒線索會切過去；在外傷或小兒病歷裡沒有線索時留在原處 */
function autoMode(t){if(NL.dept){if(S.mode!==NL.dept)setMode(NL.dept);return}const d=detectMode(t);let m=S.mode;
 if(d==='tr')m='tr';else if(d==='pd'&&S.mode==='nt')m='pd';else if(d==='adult'&&S.mode==='pd')m='nt';
 if(m===S.mode)return;setMode(m);
 toast(m==='tr'?Z('內容像外傷，已切換到外傷病歷','Looks like trauma. Switched to the trauma chart.'):m==='pd'?Z('內容像小兒個案，已切換到小兒病歷','Looks like a pediatric case. Switched to the pediatric chart.'):Z('已切換到非外傷病歷','Switched to the non-trauma chart.'))}
const TRKW='trauma|injur\\w*|wound|abrasion|contus\\w*|fracture|fx|laceration|bruis\\w*|ecchymos\\w*|hematoma|swelling|bleeding|sprain\\w*|dislocat\\w+|burn|bite|cut|fall(?:ing)?|fell|slipp?(?:ing|ed)?|accident';
const NEGT=new RegExp("\\b(?:no|denied|denies|deny|without|nil|negative for|r\\/o|rule out)\\b(?:\\s+[\\w/'-]+(?:\\s*(?:or|and)\\s+[\\w/'-]+)?){0,3}\\s+(?:"+TRKW+")\\b","gi");
const HISTT=/\b(?:s\/p|status post|post|hx of|history of|old|prior|previous)\s+[^.;\n]{0,40}?(?:fracture|fx|trauma|injury|burn|cut|wound|plasty)\b|\bcompression fx\b|burst fracture|\b(?:fracture|fx)\b[^.;\n]{0,12}\bs\/p\b|\bh\/d\b[^.;\n]{0,40}hematoma|surgical wound|a\/w\b/gi;
const TRAUMA_RE=/\bTA\b|\bMVA\b|\bMVC\b|\bRTA\b|交通事故|車禍|機車|自摔|\bfalling\b|\bfell\b|\bfall(?:s)? (?:from|down|on|onto)\b|\bslipp?(?:ing|ed)?\s*down\b|\bslid(?:e|ing) down\b|\bslipped\b|after (?:a )?fall|跌倒|跌落|墜落|摔|滑倒|撞|踢到|踩空|被.{0,6}打|打到|\bhit by\b|\bprojectile\b|\bopen wound\b|\blaceration\b|\bL\/W\b|撕裂傷|割傷|刺傷|刀傷|砍|\bstab(?:bed)?\b|\bassault(?:ed)?\b|\bassualt\w*|毆打|打鬥|暴力|鈍傷|\bcrash|collision|\baccident\b|\bgunshot|爆炸|燙傷|燒燙|咬傷|壓傷|\bcrush(?:ed)?\b|\bstruck\b|\bejected\b|contus\w*|abrasion|ecchymos\w*|sprain\w*|\bdislocat\w+|\bfracture[ds]?\b|\bbruis\w*|\bhematoma\b|魚刺|魚骨|異物|foreign body|電焊|濺入|\bsplash(?:ed)?\b|\bswallowed\b|\bfish ?bone\b|扭傷|扭到|拉傷|骨折|脫臼|挫傷|擦傷|外傷|\binjur(?:y|ed)\b|\bburn(?:ed)?\b|\bscald\b|\bbite[nd]?\b|\bbitten\b|\bcut\b|\bsuture\b|\bwelding\b|\barc eye\b|塞進|塞入|塞到|珠子|豆子|雪盲|紫外線|卡到|卡在|吞入|誤吞|鐵屑/i;

async function runAi(){const t=S.nl.trim();if(!t){NL.msg=Z('請先輸入文字。','Please enter some text first.');renderNL();return}if(!SMP)return;
 autoMode(t);
 nlCtl=new AbortController();NL.busy=true;NL.msg=Z('AI 解析中…','AI is parsing…');renderNL();
 try{const raw=await SMP.json(aiPrompt(t),{signal:nlCtl.signal,modelTier:'default',cache:false});
  if(!raw||typeof raw!=='object'||Array.isArray(raw))throw {code:'invalid_json'};
  nlDone(isTr()?normTr(raw):normNt(raw),Z('AI 解析','AI parse'))}
 catch(e){NL.busy=false;const c=e&&e.code;NL.msg=c==='cancelled'?Z('已停止。','Stopped.'):c==='not_granted'||c==='sampling_disabled'?Z('未允許使用 AI，請改用快速解析。','AI use was not allowed. Please use quick parse.'):c==='rate_limited'?Z('使用太頻繁，請稍後再試，或改用快速解析。','Too many requests. Try again later or use quick parse.'):c==='invalid_json'?Z('AI 回覆格式無法讀取，請再試一次或改用快速解析。','Could not read the AI reply. Try again or use quick parse.'):Z('AI 解析失敗，請再試一次或改用快速解析。','AI parsing failed. Try again or use quick parse.');renderNL()}

function doAllN(){const root=isTr()?'tr.reg':'pe',list=isTr()?regPrio():prio();list.forEach(s=>{if(!get(root+'.'+s)?.st)setp(root+'.'+s,{...(get(root+'.'+s)||{}),st:'n'})});rebuild();update();toast(isTr()?Z('未填部位已設為無傷','Unfilled regions set to no injury'):Z('優先系統已設為正常','Priority systems set to normal'))}

  root.onchange=e=>{if(!e.target.closest('.chart'))return;(LST.change||[]).forEach(f=>f(e));e.stopPropagation()};
  root.onscroll=()=>{const top=root.getBoundingClientRect().top+60;let c=null;STEPS[S.mode].forEach(([k])=>{const e2=$('#s-'+k);if(e2&&e2.getBoundingClientRect().top<top)c=k});$$('#steps a').forEach(x=>x.classList.toggle('act',x.dataset.k===c))};
  if(obs){obs.disconnect();obs=null}
  rebuild();update();renderNL();startObs();applyLang();fullLbl();
}
return {render};
})();
function renderDx(){
  const p=cur(),el=$('#dxs');if(!el)return;
  let h='';
  for(let i=0;i<7;i++){
    const d=p.dx[i];
    if(!d){h+=`<div class="dxr empty2"><span class="n">${i+1}</span><span class="ro">☐ R/O</span><span class="code"></span><span></span><span class="desc"></span><span></span><span></span></div>`;continue}
    const m=ICD.find(x=>x[0]===d.code)||[d.code,d.name||'',''];
    h+=`<div class="dxr"><span class="n">${i+1}</span>
      <label class="ro" title="Rule out"><input type="checkbox" data-ro="${i}" ${d.ro?'checked':''}>R/O</label>
      <span class="code">${m[0]}</span>
      <label title="Complication / Comorbidity"><input type="checkbox" data-cc="${i}" ${d.cc?'checked':''}>CC</label>
      <span class="desc" title="${m[1]} ${m[2]}">${m[1]} <span class="en">${m[2]}</span></span>
      <label class="pri"><input type="radio" name="pri" data-pri="${i}" ${i===0?'checked':''}>主診斷</label>
      <button class="x" data-rm="${i}" title="移除">×</button></div>`;
  }
  el.innerHTML=h;
}

/* ===== 事件 ===== */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.tab==='檢傷'&&cur()){openTri();return}
  if(t.dataset.dirv!==undefined&&t.closest('#dirMenu')){const id=t.closest('#dirMenu').dataset.pid;closeDir();setDir(id,t.dataset.dirv);return}
  if(t.id==='themeBtn'){THEME=THEME==='dark'?'dim':'dark';try{localStorage.setItem('er-theme',THEME)}catch(_){}applyTheme();return}
  const dtd=t.closest('td.dir:not(.auto)');
  if(dtd){openDir(dtd.closest('tr').dataset.id,e.clientX,e.clientY);return}
  closeDir();
  if(t.dataset.z){S.zone=t.dataset.z;renderChips();renderList();return}
  if(t.dataset.sort){S.sort=t.dataset.sort;renderList();return}
  if(t.closest('#viewSeg')&&t.dataset.v){
    S.view=t.dataset.v;
    document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
    renderList();return}
  if(t.dataset.ck){t.checked?S.checked.add(t.dataset.ck):S.checked.delete(t.dataset.ck);$('#hoN').textContent=S.checked.size;$('#hoApply').disabled=!S.checked.size;e.stopPropagation();return}
  const row=t.closest('[data-id]');
  if(row&&!t.matches('input')){
    if(S.ho&&S.view==='card'&&false){}
    S.sel=row.dataset.id;S.tab=S.tab||'診斷';renderList();renderDetail();return}
  if(t.id==='cAdd'){
    const p=cur(),d=$('#cDept').value,n=$('#cNote').value.trim();
    (p.consults=p.consults||[]).push({dept:d,note:n,at:Date.now(),done:false});
    p.notes.push({t:`開立會診：${d}${n?'（'+n+'）':''}`,at:new Date().toLocaleString('zh-TW',{hour12:false})});
    save();renderTab();renderList();toast(`已開立會診：${d}`);return}
  if(t.dataset.cdone!==undefined){
    const p=cur(),c=p.consults[+t.dataset.cdone];c.done=true;c.doneAt=Date.now();
    p.notes.push({t:`會診完成：${c.dept}`,at:new Date().toLocaleString('zh-TW',{hour12:false})});
    save();renderTab();renderList();return}
  if(t.id==='dToggle'){S.dmin=!S.dmin;renderDetail();return}
  if(t.dataset.icd){openIcd(t.dataset.icd);return}
  if(t.id==='icdClose'||t.id==='icdModal'){closeIcd();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;renderDetail();return}
  if(t.dataset.rm!==undefined){cur().dx.splice(+t.dataset.rm,1);renderDx();return}
  if(t.id==='saveDx'){cur().imp=$('#imp').value;save();toast('診斷已儲存');return}
  if(t.id==='addNt'){const v=$('#nt').value.trim();if(!v)return;cur().notes.push({t:v,at:new Date().toLocaleString('zh-TW',{hour12:false})});save();renderTab();return}
  const sg=t.closest('#sug [data-code]');
  if(sg){addDx(sg.dataset.code,sg.dataset.name);return}
  if(!t.closest('.sugwrap')){const s=$('#sug');if(s)s.style.display='none'}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='mciSel'){
    const p=cur(),o=p.mci;p.mci=t.value||undefined;
    p.notes.push({t:`大量傷患：${o||'無'} → ${p.mci||'無'}`,at:new Date().toLocaleString('zh-TW',{hour12:false})});
    save();renderChips();renderList();renderDetail();return;
  }
  if(t.id==='zSel'||t.id==='bedIn'){
    const p=cur(),oz=p.zone,ob=p.bed;
    if(t.id==='zSel'){
      const z=zInfo(t.value);p.zone=z.k;
      if(patients.filter(x=>x.zone===z.k).length>z.cap)toast(`${z.name} 已超過床位上限`);
      if(!p.bed.startsWith(z.k)){const n=patients.filter(x=>x.zone===z.k).length;p.bed=z.k+String(n).padStart(2,'0')}
    }else{
      const v=t.value.trim();
      if(!v||patients.some(x=>x!==p&&x.bed===v)){toast('床號空白或已被使用');t.value=p.bed;return}
      p.bed=v;
    }
    p.notes.push({t:`區域/床位：${oz} ${ob} → ${p.zone} ${p.bed}`,at:new Date().toLocaleString('zh-TW',{hour12:false})});
    save();renderChips();renderList();renderDetail();return;
  }
  if(t.dataset.cc!==undefined){cur().dx[+t.dataset.cc].cc=t.checked;save()}
  if(t.dataset.ro!==undefined){cur().dx[+t.dataset.ro].ro=t.checked;save()}
  if(t.dataset.pri!==undefined){const i=+t.dataset.pri,a=cur().dx;a.unshift(...a.splice(i,1));save();renderDx()}
});
function addDx(code,name,quiet){
  const p=cur();
  if(p.dx.length>=7)return toast('最多 7 項診斷'),false;
  if(p.dx.some(d=>d.code===code))return quiet||toast('已加入此診斷'),false;
  const e={code,ro:false};if(name&&!ICD.some(x=>x[0]===code))e.name=name;
  p.dx.push(e);save();const i=$('#icd');if(i){i.value='';$('#sug').style.display='none'}renderDx();return true;
}
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;renderList()}
  if(e.target.id==='fId'){S.fId=e.target.value;renderList()}
  if(e.target.id==='fSeq'){S.fSeq=e.target.value;renderList()}
  if(e.target.id==='fBed'){S.fBed=e.target.value;renderList()}
  if(e.target.id==='icd'){
    const v=e.target.value.trim().toLowerCase(),s=$('#sug');
    if(!v){s.style.display='none';return}
    let r;
    try{r=icdSearch().icdQuery(e.target.value,10)}catch(_){r=null}
    if(!r)r=ICD.filter(x=>(x[0]+x[1]+x[2]).toLowerCase().includes(v)).slice(0,10).map(x=>({code:x[0],name:x[1]+' / '+x[2]}));
    const esc=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    s.innerHTML=r.map(x=>`<div data-code="${x.code}" data-name="${esc(x.name)}"><span class="c">${x.code}</span><span>${esc(x.name)}</span></div>`).join('')||'<div>找不到符合的診斷</div>';
    s.style.display='block';
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='icd'&&e.key==='Enter'){const f=document.querySelector('#sug [data-code]');if(f)addDx(f.dataset.code,f.dataset.name)}
});

/* ===== 動向選單 ===== */
const DIRS=['看診中','等決定','等照會','等洗腎','等手術','等住院','等ICU','洗腎中','回家','觀察後續追蹤','等縫合','等轉院','等檢查','手術中','外出處置中'];
function closeDir(){const m=$('#dirMenu');if(m)m.remove()}
function openDir(id,x,y){
  closeDir();
  const p=patients.find(q=>q.id===id);if(!p)return;
  const m=document.createElement('div');m.className='dirmenu';m.id='dirMenu';m.dataset.pid=id;
  m.innerHTML=DIRS.map(d=>`<div data-dirv="${d}" class="${d===p.dir?'cur':''}">${d}</div>`).join('')+`<div data-dirv="" class="clr">清除動向</div>`;
  document.body.appendChild(m);
  const w=m.offsetWidth,h=m.offsetHeight;
  m.style.left=Math.max(4,Math.min(x,innerWidth-w-4))+'px';
  m.style.top=Math.max(4,Math.min(y,innerHeight-h-4))+'px';
}
function setDir(id,v){
  const p=patients.find(q=>q.id===id);if(!p)return;
  const old=p.dir;p.dir=v;
  p.notes.push({t:`動向：${old||'無'} → ${v||'無'}`,at:new Date().toLocaleString('zh-TW',{hour12:false})});
  save();renderList();toast(`${p.bed} ${p.name}：${v||'已清除動向'}`);
}

/* ===== 配色主題 ===== */
let THEME='dim';try{THEME=localStorage.getItem('er-theme')||'dim'}catch(e){}
function applyTheme(){document.body.classList.toggle('dark',THEME==='dark');$('#themeBtn').textContent=THEME==='dark'?'☀ 護眼':'☾ 夜間'}
applyTheme();

/* ===== 診斷查詢工具（icd/） ===== */
const ICD_PAGE={all:'icd/all-icd10-search.html',trauma:'icd/trauma-icd10.html'};
function icdSearch(){const w=$('#icdSearchFrame').contentWindow;if(!w.icdQuery)throw 0;return w}
setTimeout(()=>{$('#icdSearchFrame').src=ICD_PAGE.all},300);
function openIcd(k){
  const p=cur();if(!p)return;
  $('#icdModal').style.display='flex';
  $('#icdWho').textContent=`診斷查詢 — ${p.bed} ${p.name}`;
  const f=$('#icdFrame');if(f.dataset.k!==k){f.dataset.k=k;f.src=ICD_PAGE[k]}
}
function closeIcd(){$('#icdModal').style.display='none'}
window.addEventListener('message',e=>{
  const d=e.data;if(!d||d.type!=='icd-pick'||!Array.isArray(d.items))return;
  let n=0;for(const it of d.items){if(addDx(it.code,it.name,true))n++}
  toast(`已加入 ${n} 項診斷`+(n<d.items.length?`（${d.items.length-n} 項重複或超過上限）`:''));
  if(n&&!d.keep)closeIcd();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeIcd();closeDir()}});
document.getElementById('listwrap').addEventListener('scroll',closeDir);

/* ===== 交班 ===== */
function fillSel(id,arr,first){$(id).innerHTML=(first?`<option value="">${first}</option>`:'')+arr.map(d=>`<option>${d}</option>`).join('')}
fillSel('#hoFrom',DOCTORS,'— 選擇醫師 —');fillSel('#hoDoc',DOCTORS);
$('#hoBtn').onclick=()=>{
  S.ho=!S.ho;S.checked.clear();$('#ho').classList.toggle('show',S.ho);
  $('#hoBtn').classList.toggle('on',S.ho);$('#hoBtn').textContent=S.ho?'結束交班':'交班';renderList();
};
$('#hoAll').onclick=()=>{filtered().forEach(p=>S.checked.add(p.id));renderList()};
$('#hoNone').onclick=()=>{S.checked.clear();renderList()};
$('#hoFrom').onchange=e=>{if(!e.target.value)return;filtered().filter(p=>p.doc===e.target.value).forEach(p=>S.checked.add(p.id));renderList()};
$('#hoApply').onclick=()=>{
  const doc=$('#hoDoc').value,nur='',n=S.checked.size;
  patients.forEach(p=>{if(S.checked.has(p.id)){p.doc=doc;if(nur)p.nur=nur;
    p.notes.push({t:`交班：主責醫師 → ${doc}${nur?'，護理師 → '+nur:''}`,at:new Date().toLocaleString('zh-TW',{hour12:false})})}});
  S.checked.clear();save();renderList();renderDetail();
  toast(`已將 ${n} 位病人交班給 ${doc}`);
};

/* 初始化 */
renderChips();renderList();renderDetail();
document.addEventListener('click',e=>{if(e.target.dataset.z)renderChips()});
</script>
