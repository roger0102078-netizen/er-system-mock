<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>檢傷視窗 示意版（依TTAS基準）</title>
<style>
:root{
  --bg:#eef2ee; --panel:#fff; --ink:#1d2b24; --mute:#66756d; --line:#d5ddd7; --accent:#0f7f74;
  --l1:#d62839; --l2:#ef7d16; --l3:#f2c200; --l4:#2f9e55; --l5:#8a97a0;
  --l1t:#fff; --l2t:#fff; --l3t:#2b2400; --l4t:#fff; --l5t:#fff;
  --warn:#c0392b; --down:#2563b0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121816;--panel:#1b2420;--ink:#e6efe9;--mute:#93a39a;--line:#2d3a34;--accent:#2bb3a4}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;padding:16px}
.note{max-width:1100px;margin:0 auto 10px;color:var(--mute);font-size:13px}
.dlg{max-width:1100px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.hd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hd h1{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
.hd h1 i{color:var(--warn);font-style:normal}
.pt{font-weight:600}
.pt small{font-weight:400;color:var(--mute);margin-left:6px}
.vitals{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.v{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--mute)}
.v b{color:var(--ink);font-size:14px;margin-left:3px}
.v.abn{border-color:var(--warn)}
.v.abn b{color:var(--warn)}
.main{display:grid;grid-template-columns:300px 1fr;min-height:430px}
@media(max-width:760px){.main{grid-template-columns:1fr}}
.left{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--bg) 60%,var(--panel))}
.left input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.left h4{margin:2px 0 0;font-size:12px;color:var(--mute);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.tree{overflow:auto;max-height:420px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.cat li button small,.res small{color:var(--mute);margin-left:6px;font-size:11px}
.cat li button.sel small{color:#fff;opacity:.8}
.res{all:unset;display:block;width:100%;padding:6px 8px;border-radius:5px;cursor:pointer;box-sizing:border-box;border-bottom:1px solid var(--line)}
.res:hover{background:var(--bg)}
.sec{display:inline-block;font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;opacity:.75;vertical-align:1px}
.banner{background:color-mix(in srgb,var(--l3) 25%,var(--panel));border:1px solid var(--l3);border-radius:6px;padding:6px 10px;font-size:13px}
.banner a{color:var(--accent);cursor:pointer;text-decoration:underline;margin-left:6px}
.legend{font-size:12px;color:var(--mute)}
.pick{font-size:13px;color:var(--mute);flex-basis:100%}
.pick b{color:var(--ink)}
.cat{border:1px solid var(--line);background:var(--panel);border-radius:6px;margin-bottom:5px}
.cat>button{all:unset;display:flex;justify-content:space-between;width:100%;padding:7px 10px;cursor:pointer;box-sizing:border-box;font-weight:600}
.cat>button:focus-visible{outline:2px solid var(--accent)}
.cat.open>button{color:var(--accent)}
.cat ul{list-style:none;margin:0;padding:0 6px 6px;display:none}
.cat.open ul{display:block}
.cat li button{all:unset;display:block;width:100%;padding:5px 8px;border-radius:5px;cursor:pointer;box-sizing:border-box}
.cat li button:hover{background:var(--bg)}
.cat li button.sel{background:var(--accent);color:#fff}
.right{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--mute);padding:40px 0;text-align:center}
.crumb{font-size:13px;color:var(--mute)}
.crumb b{color:var(--ink);font-size:17px}
.lv{display:grid;grid-template-columns:70px 1fr;border-radius:8px;overflow:hidden;border:2px solid transparent}
.lv .tag{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;padding:6px 0}
.lv .tag span{font-size:22px;line-height:1}
.lv .tag small{font-size:11px;font-weight:500}
.lv .opts{background:color-mix(in srgb,var(--c) 14%,var(--panel));display:flex;flex-direction:column}
.lv .opts button,.lv .opts .none{all:unset;padding:8px 12px;cursor:pointer;box-sizing:border-box;border-bottom:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.lv .opts button:last-child,.lv .opts .none{border-bottom:0}
.lv .opts button:hover{background:color-mix(in srgb,var(--c) 28%,var(--panel))}
.lv .opts button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.lv .opts button.sel{background:var(--c);color:var(--ct);font-weight:600}
.lv .opts .none{color:var(--mute);font-size:13px;cursor:default}
.lv.cur{border-color:var(--ink)}
.bar{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:10px;background:color-mix(in srgb,var(--bg) 60%,var(--panel))}
.change{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.big{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:46px;border-radius:8px;font-size:26px;font-weight:700}
.arrow{font-size:20px;color:var(--mute)}
.verdict{font-weight:700}
.verdict.up{color:var(--warn)}.verdict.down{color:var(--down)}.verdict.same{color:var(--mute);font-weight:500}
.manual{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.manual button{width:30px;height:30px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer;font:inherit}
.manual button.on{background:var(--ink);color:var(--panel)}
.reason{display:none;gap:8px;grid-template-columns:1fr 1fr}
.reason.show{display:grid}
@media(max-width:760px){.reason{grid-template-columns:1fr}}
.reason select,.reason textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.reason select.err{border-color:var(--warn);outline:1px solid var(--warn)}
.reason textarea{resize:vertical;min-height:38px}
.hint{font-size:12.5px;color:var(--warn);min-height:18px}
.act{display:flex;gap:8px;align-items:center}
.act .kb{margin-right:auto;font-size:12px;color:var(--mute)}
.btn{border:0;border-radius:6px;padding:9px 20px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.last{font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--panel);border-radius:10px;padding:20px;max-width:380px;width:100%}
.modal h3{margin:0 0 6px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

.hd select{font:inherit;font-size:13px;padding:1px 4px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink)}
.modal .box.wide{max-width:960px;max-height:90vh;overflow:auto;width:100%}
.refhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.rt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.rt th,.rt td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.rt th{font-weight:700}
.rt td.lab{font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--bg) 60%,var(--panel))}
.rt td.c{background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.rnote{font-size:12.5px;color:var(--mute);margin:8px 0 0;padding-left:18px}
.rnote li{margin:2px 0}
.hint2{font-size:12px;color:var(--mute)}
.hd .btn{padding:5px 12px;font-size:13px}
/* 深色主題：由模擬系統指定（嵌入時不跟隨作業系統） */
:root[data-theme="dark"]{--bg:#121816;--panel:#1b2420;--ink:#e6efe9;--mute:#93a39a;--line:#2d3a34;--accent:#2bb3a4}
/* 嵌入模擬系統（iframe）時：填滿視窗，內容區自行捲動，下方儲存列固定 */
html.emb body{padding:0;background:var(--panel)}
html.emb .dlg{max-width:none;margin:0;border:0;border-radius:0;box-shadow:none;height:100vh;display:flex;flex-direction:column;overflow:hidden}
html.emb .main{flex:1 1 auto;min-height:0;grid-template-rows:minmax(0,1fr)}
html.emb .left,html.emb .right{overflow:auto;min-height:0}
html.emb .right>*{flex:none}   /* 各級別列不要被壓扁，內容多時由右側欄捲動 */
html.emb .tree{max-height:none}
html.emb .bar{flex:none;max-height:46vh;overflow:auto}
/* 螢幕高度較矮時：壓縮上下兩列，讓中間的判定依據有足夠空間 */
@media(max-height:760px){
  html.emb .hd{padding:6px 14px;gap:8px}
  html.emb .bar{padding:6px 14px;gap:4px}
  html.emb .act .kb{display:none}
  html.emb .big{min-width:38px;height:38px;font-size:22px}
  html.emb .reason select,html.emb .reason textarea{padding:5px 8px}
  html.emb .reason textarea{height:34px;min-height:34px}
  html.emb .left{padding:8px;gap:6px}
  html.emb .right{padding:8px 14px;gap:6px}
}
@media(max-width:760px){
  html.emb .main{overflow:auto;grid-template-rows:auto}
  html.emb .left,html.emb .right{overflow:visible}
  html.emb .tree{max-height:260px}
  html.emb .hd{padding:8px 12px}
  html.emb .vitals{margin-left:0}
}
</style>
</head>
<body>
<div class="dlg" role="dialog" aria-labelledby="ttl">
  <div class="hd">
    <h1 id="ttl"><i>✚</i>檢傷類別（五級檢傷）</h1>
    <div class="pt"><span id="ptName"></span><small id="ptSub"></small></div>
    <div class="vitals" id="vitals"></div>
    <button class="btn ghost" id="refBtn" type="button">調節變數對照表</button>
  </div>

  <div class="main">
    <div class="left">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="hint2" id="kindHint"></div>
      <input id="q" type="search" placeholder="搜尋主訴（全部類型），例如：胸痛、抽搐" aria-label="搜尋主訴">
      <h4 id="treeH">大分類</h4>
      <div class="tree" id="tree"></div>
    </div>

    <div class="right" id="right"></div>
  </div>

  <div class="bar">
    <div class="change">
      <span class="last">目前級數</span>
      <span class="big" id="curBig"></span>
      <span class="arrow">→</span>
      <span class="big" id="newBig"></span>
      <span class="verdict" id="verdict"></span>
      <span class="pick" id="pickTxt"></span>
      <div class="manual">手動調整：<span id="manual"></span></div>
    </div>
    <div class="reason" id="reason">
      <select id="why" aria-label="修改原因（必填）">
        <option value="">修改原因（必填）</option>
        <option>病人主訴與電腦判斷不符</option>
        <option>生命徵象與判斷依據不符</option>
        <option>病情變化/再評估</option>
        <option>臨床經驗判斷</option>
        <option>家屬／病人反映</option>
        <option>其他</option>
      </select>
      <textarea id="memo" placeholder="備註（選「其他」時必填）"></textarea>
    </div>
    <div class="hint" id="hint"></div>
    <div class="act">
      <span class="kb">鍵盤：1–5 選級　Enter 儲存　Esc 取消</span>
      <button class="btn ghost" id="reset">還原</button>
      <button class="btn ghost" id="cancel">取消</button>
      <button class="btn" id="save">儲存</button>
    </div>
    <div class="last" id="lastMod"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="refModal"><div class="box wide" role="dialog" aria-modal="true" aria-label="首要調節變數對照表">
  <div class="refhd"><b id="refTitle"></b><button class="btn ghost" id="refClose" type="button">關閉</button></div>
  <div class="tabs" id="refTabs"></div>
  <div id="refBody"></div>
</div></div>
<div class="modal" id="modal"><div class="box" role="alertdialog" aria-modal="true">
  <h3 id="mT">確認降級</h3><div id="mB"></div>
  <div class="row"><button class="btn ghost" id="mNo">返回</button><button class="btn" id="mYes">確認降級並儲存</button></div>
</div></div>

<script>
const LV={1:["復甦急救","var(--l1)","var(--l1t)"],2:["危急","var(--l2)","var(--l2t)"],3:["緊急","var(--l3)","var(--l3t)"],4:["次緊急","var(--l4)","var(--l4t)"],5:["非緊急","var(--l5)","var(--l5t)"]};
// 資料來源：急診五級檢傷分類基準修正版（成人非外傷／外傷／環境／兒童／總表），A0410 發作時間採 4.5 小時

function paintVitals(){$("vitals").innerHTML=VIT.map(v=>`<span class="v ${v[2]?'abn':''}">${esc(v[0])}<b>${esc(v[1])}</b></span>`).join("")}

// ---- 年齡：未滿 18 歲（216 個月）用兒童基準
function kind(){return forced||(ageM<216?"P":"A")}
function curTi(){return tab==="N"?(kind()==="P"?3:0):(tab==="T"?1:2)}
function kindName(k){return k==="P"?"兒童":"成人"}

function jump(code){
 const r=byCode[code];if(!r)return;
 if(r.ti===0||r.ti===3){tab="N";const k=r.ti===3?"P":"A";if(k!==(ageM<216?"P":"A"))forced=k;else forced=null}
 else tab=r.ti===1?"T":"E";
 cat=r.cat.c;comp=code;openCats.add(cat);pick=null;$("q").value="";renderAll();
}
function renderTabs(){
 const nTxt=`非外傷（${kindName(kind())}）`;
 let h=`<button class="tab ${tab==="N"?'on':''}" data-t="N">${nTxt}</button><button class="tab ${tab==="T"?'on':''}" data-t="T">外傷</button><button class="tab ${tab==="E"?'on':''}" data-t="E">環境</button>`;
 $("tabs").innerHTML=h;
 $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;cat=null;comp=null;pick=null;renderAll()});
 let hint="";
 if(tab==="N"){
  const auto=ageM<216?"P":"A";
  hint=`依年齡自動使用<b>${kindName(auto)}</b>基準${forced?`（已手動改為${kindName(forced)}）`:''}　<a href="#" id="swapKind">改用${kindName(kind()==="P"?"A":"P")}</a>`;
 }else hint="外傷、環境不分成人／兒童，使用同一份基準"+(tab==="T"&&kind()==="P"?"（兒童加註見右側）":"");
 $("kindHint").innerHTML=hint;
 const sw=$("swapKind");
 if(sw)sw.onclick=e=>{e.preventDefault();forced=kind()==="P"?"A":"P";if(forced===(ageM<216?"P":"A"))forced=null;cat=null;comp=null;pick=null;renderAll()};
}
function renderTree(){
 const q=$("q").value.trim(),ti=curTi();
 if(q){
  const hits=[];
  TYPES.forEach((t,i)=>t.cats.forEach(c=>c.m.forEach(m=>{if(m.n.includes(q)||m.c.toLowerCase()===q.toLowerCase()||c.n.includes(q))hits.push({t:t,c:c,m:m})})));
  $("treeH").textContent=`搜尋結果（${hits.length}）`;
  $("tree").innerHTML=hits.length?hits.map(h=>`<button class="res" data-c="${h.m.c}">${esc(h.m.n)}<small>${esc(h.t.n)} › ${esc(h.c.n)}</small></button>`).join(""):'<div class="empty">找不到符合的主訴</div>';
  $("tree").querySelectorAll(".res").forEach(b=>b.onclick=()=>jump(b.dataset.c));
  return;
 }
 $("treeH").textContent="大分類";
 let h="";
 const com=(COMMON[ti]||[]).filter(c=>byCode[c]);
 if(com.length)h+=`<div class="cat open"><button data-k="__common"><span>常用主訴</span><span>▾</span></button><ul>${com.map(c=>`<li><button data-c="${c}">${esc(byCode[c].m.n)}</button></li>`).join("")}</ul></div>`;
 TYPES[ti].cats.forEach(c=>{
  const open=openCats.has(c.c);
  h+=`<div class="cat ${open?'open':''}"><button data-k="${c.c}"><span>${esc(c.n)}</span><span>${open?'▾':'▸'}</span></button><ul>${c.m.map(m=>`<li><button data-c="${m.c}" class="${m.c===comp?'sel':''}">${esc(m.n)}</button></li>`).join("")}</ul></div>`;
 });
 $("tree").innerHTML=h;
 $("tree").querySelectorAll(".cat>button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="__common")return;if(openCats.has(k))openCats.delete(k);else openCats.add(k);renderTree()});
 $("tree").querySelectorAll("li button").forEach(b=>b.onclick=()=>jump(b.dataset.c));
}

   notes:["兒童疼痛不區分中樞型或周邊型。","<2 個月早產兒/新生兒用 NIPS；≥2 個月至<3 歲或無法口頭表達者用 FLACC；≥3 歲至<18 歲用臉譜量表(十分量表)。"]},
  MECH_PED,COAG
 ]
};
let refTab=0;
function renderRef(){
 const k=kind(),secs=REF[k];
 if(refTab>=secs.length)refTab=0;
 $("refTitle").textContent=`首要調節變數對照表（${kindName(k)}）`;
 $("refTabs").innerHTML=secs.map((s,i)=>`<button class="tab ${i===refTab?'on':''}" data-i="${i}">${esc(s.t.replace(/（.*）/,""))}</button>`).join("");
 $("refTabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{refTab=+b.dataset.i;renderRef()});
 const s=secs[refTab];
 let h=`<table class="rt"><thead><tr><th>${esc(s.t)}</th>${[1,2,3,4,5].map(l=>`<th style="background:${LV[l][1]};color:${LV[l][2]}">${l} 級 ${LV[l][0]}</th>`).join("")}</tr></thead><tbody>`;
 s.rows.forEach(r=>{h+=`<tr><td class="lab">${esc(r.l)}</td>`+r.c.map((c,i)=>`<td class="c" style="--c:${LV[i+1][1]}">${esc(c).replace(/\n/g,"<br>")}</td>`).join("")+"</tr>"});
 h+="</tbody></table>";
 if(s.notes.length)h+='<ul class="rnote">'+s.notes.map(n=>`<li>${esc(n)}</li>`).join("")+"</ul>";
 $("refBody").innerHTML=h;
}
$("refBtn").onclick=()=>{renderRef();$("refModal").classList.add("show")};
$("refClose").onclick=()=>$("refModal").classList.remove("show");
$("refModal").onclick=e=>{if(e.target===$("refModal"))$("refModal").classList.remove("show")};

$("save").onclick=trySave;
$("mYes").onclick=()=>{$("modal").classList.remove("show");doSave()};
$("mNo").onclick=()=>$("modal").classList.remove("show");
$("reset").onclick=()=>{pick=null;$("why").value="";$("memo").value="";setLevel(ORIG)};
$("cancel").onclick=()=>{if(EMB)toParent({tw:"close"});else toast("已取消（示意）")};
$("why").onchange=()=>validate(false);$("memo").oninput=()=>validate(false);
$("q").oninput=renderTree;
document.addEventListener("keydown",e=>{
 const t=e.target.tagName;
 if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
 if($("refModal").classList.contains("show")){if(e.key==="Escape")$("refClose").click();return}
 if($("modal").classList.contains("show")){if(e.key==="Escape")$("mNo").click();return}
 if(/^[1-5]$/.test(e.key)){pick=null;setLevel(+e.key)}
 else if(e.key==="Enter"&&t!=="BUTTON"){trySave()}
 else if(e.key==="Escape"){$("cancel").click()}
});
function renderAll(){renderTabs();renderTree();renderRight();update()}

/* ---------- 讀入病人資料並開始 ----------
   嵌在模擬系統時，病人資料由 window.parent.TriWin.ctx 提供；單獨開啟時用下面的示範病人。 */
const DEMO={name:"周詩涵",sex:"女",ageText:"30 歲",ageM:360,arrive:"05:23",cc:"機車擦撞",lvl:4,trauma:true,dark:false,tri:null,lastMod:"",
 vs:[["BP","128/82",0],["HR","112",1],["SpO₂","97%",0],["BT","36.8°",0],["疼痛","6/10",0]]};
function start(C){
 ORIG=C.lvl;level=ORIG;autoLvl=null;ageM=C.ageM;forced=null;pick=null;comp=null;cat=null;
 tab=C.trauma?"T":"N";openCats=new Set();
 document.documentElement.dataset.theme=C.dark?"dark":"light";
 $("ptName").textContent=C.name;
 $("ptSub").textContent=`${C.sex} / ${C.ageText} · 到院 ${C.arrive} · 主訴：${C.cc}`;
 VIT=C.vs||[];paintVitals();
 $("lastMod").textContent=C.lastMod||`目前級數 ${ORIG} 級（尚無檢傷修改紀錄）`;
 const t=C.tri;
 if(t&&t.code&&byCode[t.code]){                       // 之前檢傷過：直接展開當時選的主訴與判定依據
  jump(t.code);
  const i=byCode[t.code].m.k.findIndex(k=>k[1]===t.basis);
  if(i>=0){pick={i:i};autoLvl=byCode[t.code].m.k[i][0];renderRight();update();
   const b=$("right").querySelector(".opts button.sel");if(b)b.scrollIntoView({block:"center"})}   // 捲到之前選的判定依據
 }else renderAll();
 window.focus();
}
if(EMB){
 addEventListener("message",e=>{if(e.source===window.parent&&e.data&&e.data.tw==="ctx")start(e.data.ctx)});
 toParent({tw:"ready"});                              // 通知外層：我準備好了，請把病人資料傳過來
}else start(DEMO);
</script>
